[package]
name = "pilas"
version = "2.0.0"
description = "¡Pilas! · Hábitos y objetivos (escritorio)"
authors = ["Pilas"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "pilas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
