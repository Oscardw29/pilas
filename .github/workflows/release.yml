# Publica una versión: al subir una etiqueta v* (p. ej. `git tag v2.0.0 && git push --tags`)
# compila Windows (.exe), Linux (.AppImage/.deb) y Android (.apk firmado) y los adjunta a un
# borrador de GitHub Release. Cada instalador va con un nombre fijo, sin la versión (Pilas-Windows.exe, Pilas-Android.apk,
# Pilas-Linux.AppImage, Pilas-Linux.deb): la página /descargar los descarga directamente de la última versión publicada. Gratis en repos públicos (2000 min/mes en privados).
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY   proyecto de Supabase (públicos por diseño)
#   ANDROID_KEYSTORE_BASE64                            el .jks en base64
#   ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      # Solo compila (sin tagName no sube nada): a la versión van únicamente los instaladores con nombre fijo, sin duplicados
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nombre fijo: /descargar los enlaza con …/releases/latest/download/<nombre> (descarga directa de la última versión)
      - name: Instaladores con nombre fijo
        shell: bash
        run: |
          mkdir -p fixed
          b=src-tauri/target/release/bundle
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "$(ls $b/nsis/*-setup.exe | head -1)" fixed/Pilas-Windows.exe
          else
            cp "$(ls $b/appimage/*.AppImage | head -1)" fixed/Pilas-Linux.AppImage
            cp "$(ls $b/deb/*.deb | head -1)" fixed/Pilas-Linux.deb
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: '¡Pilas! ${{ github.ref_name }}'
          body: 'Windows: descarga Pilas-Windows.exe. Android: Pilas-Android.apk. Linux: Pilas-Linux.AppImage o .deb. iPhone, iPad y Mac: usa la app web (Añadir a pantalla de inicio / Añadir al Dock).'
          draft: true
          files: fixed/*

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pilas-release.jks"
      - name: APK firmado
        env:
          PILAS_KEYSTORE_PATH: ${{ runner.temp }}/pilas-release.jks
          PILAS_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          PILAS_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PILAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: npm run android:apk
      - name: Nombre del APK
        run: cp android/app/build/outputs/apk/release/*-signed.apk Pilas-Android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: Pilas-Android.apk
      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pilas-release.jks"
