# Publica una versión: al subir una etiqueta v* (p. ej. `git tag v2.0.0 && git push --tags`)
# compila Windows (.exe), Linux (.AppImage/.deb) y Android (.apk firmado) y los adjunta a un
# borrador de GitHub Release. Un solo archivo por plataforma y siempre con el mismo nombre (Pilas-Windows.exe,
# Pilas-Android.apk, Pilas-Linux.AppImage, Pilas-Linux.deb): la página /descargar los baja directamente de la última versión
# publicada (…/releases/latest/download/<nombre>). El número de versión va en el título de la versión, no en el archivo.
# Gratis en repos públicos (2000 min/mes en privados).
# La versión de los instaladores sale de la etiqueta (scripts/set-version.mjs): no hace falta cambiarla a mano.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY   proyecto de Supabase (públicos por diseño: mejor como *variables*)
#   ANDROID_KEYSTORE_BASE64                            el .jks en base64
#   ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Valores públicos por diseño: se leen de las variables del repositorio (o de un secreto con el mismo nombre)
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_DOWNLOADS_URL: ${{ vars.VITE_DOWNLOADS_URL }}

jobs:
  # Crea el borrador una sola vez (si ya existe, lo deja): los demás trabajos solo suben su archivo a él
  draft:
    runs-on: ubuntu-22.04
    steps:
      - name: Borrador de la versión
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" --draft --verify-tag \
              --title "¡Pilas! $TAG" \
              --notes "Descarga el instalador para tu sistema. iOS y macOS: usa la app web (Añadir a pantalla de inicio / Añadir al Dock)."

  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Versión desde la etiqueta
        run: node scripts/set-version.mjs "${{ github.ref_name }}"
      - run: npm test
      # Solo compila: sin `tagName` no sube nada (así no aparecen copias con el número en el nombre)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nombre fijo: /descargar los enlaza con …/releases/latest/download/<nombre> (descarga directa)
      - name: Instaladores con nombre fijo
        shell: bash
        run: |
          mkdir -p fixed
          b=src-tauri/target/release/bundle
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "$(ls $b/nsis/*-setup.exe | head -1)" fixed/Pilas-Windows.exe
          else
            cp "$(ls $b/appimage/*.AppImage | head -1)" fixed/Pilas-Linux.AppImage
            cp "$(ls $b/deb/*.deb | head -1)" fixed/Pilas-Linux.deb
          fi
      - name: Subir al borrador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" fixed/* --clobber --repo "${{ github.repository }}"

  android:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Versión desde la etiqueta
        run: node scripts/set-version.mjs "${{ github.ref_name }}"
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pilas-release.jks"
      - name: APK firmado
        env:
          PILAS_KEYSTORE_PATH: ${{ runner.temp }}/pilas-release.jks
          PILAS_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          PILAS_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PILAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: npm run android:apk
      - name: Nombre del APK
        run: |
          cp android/app/build/outputs/apk/release/*-signed.apk Pilas-Android.apk
      - name: Subir al borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" Pilas-Android.apk --clobber --repo "${{ github.repository }}"
      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pilas-release.jks"
