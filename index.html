<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- La Content-Security-Policy se inyecta solo en el build de producción (ver vite.config.ts) -->
    <meta name="referrer" content="no-referrer" />
    <!-- Tema claro por defecto; public/theme-init.js aplica el último elegido (data-theme) antes de pintar -->
    <meta name="theme-color" content="#f5f4fa" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme-init.js"></script>
    <!-- Fondo mientras carga la hoja de estilos (sin especificidad: global.css manda en cuanto llega) -->
    <style>
      :where(html) { background: #f5f4fa; }
      :where(html[data-theme='dark']) { background: #0c0c10; }
    </style>
    <meta name="description" content="¡Pilas!: ponte las pilas con tus hábitos, objetivos y rachas, con coach de IA." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="¡Pilas!" />
    <title>¡Pilas! · Hábitos y objetivos</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
