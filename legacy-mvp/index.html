<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Constancia · Seguimiento de hábitos</title>
  <meta name="description" content="Seguimiento semanal de hábitos con puntos y recompensas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar (escritorio) -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><i data-icon="check"></i></div>
        <span>Constancia</span>
      </div>
      <nav class="nav">
        <a href="#dashboard" data-route="dashboard"><i data-icon="home"></i>Inicio</a>
        <a href="#semana" data-route="semana"><i data-icon="calendar"></i>Mi semana</a>
        <a href="#recompensas" data-route="recompensas"><i data-icon="gift"></i>Recompensas</a>
      </nav>
      <div class="sidebar-foot">
        <div class="points-card">
          <span>Puntos disponibles</span>
          <strong class="js-points">0</strong>
        </div>
        <button class="link-btn" data-action="open-settings"><i data-icon="settings"></i>Datos de la app</button>
      </div>
    </aside>

    <main class="main">
      <!-- Topbar (móvil) -->
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark"><i data-icon="check"></i></div>
          <span>Constancia</span>
        </div>
        <div class="topbar-right">
          <div class="points-pill"><i data-icon="spark"></i><span class="js-points">0</span></div>
          <button class="icon-btn" data-action="open-settings" aria-label="Datos"><i data-icon="settings"></i></button>
        </div>
      </header>

      <div id="view" class="view"></div>
    </main>

    <!-- Navegación inferior (móvil) -->
    <nav class="bottom-nav">
      <a href="#dashboard" data-route="dashboard"><i data-icon="home"></i><span>Inicio</span></a>
      <a href="#semana" data-route="semana"><i data-icon="calendar"></i><span>Semana</span></a>
      <a href="#recompensas" data-route="recompensas"><i data-icon="gift"></i><span>Recompensas</span></a>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
