<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Pila: borne + cuerpo, ligeramente inclinada para dar sensación de impulso -->
  <g transform="rotate(12 32 33)">
    <rect x="26" y="8.5" width="12" height="6" rx="2.2" fill="#fff"/>
    <rect x="17.5" y="13" width="29" height="44" rx="8.5" fill="#fff"/>
    <!-- Rayo: también se lee como el «!» del nombre -->
    <path d="M35.5 18 L23.5 37.5 H31 L28.5 52 L41 31.5 H33.5 Z" fill="url(#bolt)" stroke="#b45309" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
